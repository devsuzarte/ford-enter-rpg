<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" fill="none">
  <defs>
    <radialGradient id="aglow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#60b870" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#60b870" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aleather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a7040"/>
      <stop offset="100%" stop-color="#2a3a18"/>
    </linearGradient>
    <linearGradient id="abow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a6030"/>
      <stop offset="100%" stop-color="#4a3010"/>
    </linearGradient>
    <linearGradient id="acloak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a28"/>
      <stop offset="100%" stop-color="#1a2410"/>
    </linearGradient>
  </defs>

  <!-- glow -->
  <ellipse cx="60" cy="110" rx="46" ry="38" fill="url(#aglow)"/>

  <!-- legs -->
  <rect x="42" y="114" width="13" height="32" rx="5" fill="#2a3a18"/>
  <rect x="65" y="114" width="13" height="32" rx="5" fill="#2a3a18"/>
  <!-- boots -->
  <rect x="40" y="136" width="17" height="10" rx="3" fill="#1a2410"/>
  <rect x="63" y="136" width="17" height="10" rx="3" fill="#1a2410"/>

  <!-- cloak / back -->
  <path d="M36 78 Q28 105 32 148 L50 148 L50 114 L70 114 L70 148 L88 148 Q92 105 84 78Z" fill="url(#acloak)" opacity=".6"/>

  <!-- torso – leather vest -->
  <rect x="36" y="76" width="48" height="40" rx="8" fill="url(#aleather)"/>
  <!-- vest detail -->
  <line x1="60" y1="78" x2="60" y2="112" stroke="#4a6030" stroke-width="1.5" opacity=".7"/>
  <rect x="44" y="84" width="32" height="22" rx="3" fill="#4a6030" opacity=".4"/>
  <!-- shoulder pads -->
  <ellipse cx="36" cy="82" rx="9" ry="7" fill="#608050"/>
  <ellipse cx="84" cy="82" rx="9" ry="7" fill="#608050"/>

  <!-- quiver (right back) -->
  <rect x="80" y="68" width="10" height="36" rx="4" fill="#4a3010" stroke="#6a5020" stroke-width="1"/>
  <line x1="83" y1="68" x2="83" y2="72" stroke="#c8a040" stroke-width="1.5"/>
  <line x1="86" y1="65" x2="86" y2="70" stroke="#c8a040" stroke-width="1.5"/>
  <line x1="89" y1="67" x2="89" y2="72" stroke="#c8a040" stroke-width="1.5"/>

  <!-- bow arm (left) -->
  <line x1="36" y1="86" x2="12" y2="72" stroke="#2a3a18" stroke-width="10" stroke-linecap="round"/>
  <!-- bow (vertical, in front of left arm) -->
  <path d="M14 44 Q2 72 14 100" stroke="url(#abow)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- bowstring -->
  <line x1="14" y1="44" x2="14" y2="100" stroke="#ddd0b0" stroke-width="1.5" opacity=".8"/>
  <!-- arrow nocked -->
  <line x1="14" y1="72" x2="72" y2="86" stroke="#c8a040" stroke-width="1.5" stroke-linecap="round"/>
  <!-- arrowhead -->
  <polygon points="72,82 80,86 72,90" fill="#a0a8b8"/>

  <!-- draw arm (right) -->
  <line x1="84" y1="86" x2="72" y2="86" stroke="#2a3a18" stroke-width="9" stroke-linecap="round"/>
  <!-- fingers on string -->
  <circle cx="72" cy="86" r="4" fill="#3a4a28" stroke="#60b870" stroke-width="1"/>

  <!-- neck -->
  <rect x="52" y="62" width="16" height="16" rx="4" fill="#5a7040"/>

  <!-- hood -->
  <path d="M38 52 Q36 30 60 22 Q84 30 82 52 Q80 66 60 70 Q40 66 38 52Z" fill="#3a4a28"/>
  <!-- hood shadow -->
  <ellipse cx="60" cy="52" rx="22" ry="18" fill="#2a3818"/>

  <!-- face -->
  <ellipse cx="60" cy="50" rx="14" ry="16" fill="#c8a070"/>
  <!-- hood brim -->
  <path d="M40 46 Q50 38 60 36 Q70 38 80 46" stroke="#4a6030" stroke-width="2" fill="none"/>

  <!-- eyes – focused/narrow -->
  <rect x="50" y="48" width="8" height="3" rx="1.5" fill="#2a4a20"/>
  <rect x="62" y="48" width="8" height="3" rx="1.5" fill="#2a4a20"/>
  <!-- eye gleam -->
  <rect x="51" y="48" width="4" height="3" rx="1.5" fill="#80cc60" opacity=".8"/>
  <rect x="63" y="48" width="4" height="3" rx="1.5" fill="#80cc60" opacity=".8"/>

  <!-- leaf detail on cloak -->
  <text x="56" y="138" font-family="serif" font-size="9" fill="#4a6030" opacity=".7">✿</text>
</svg>
